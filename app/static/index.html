<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcvale · Policy questions</title>
<style>
  :root {
    --bg: #f7f6f2;
    --ink: #1f1e1b;
    --muted: #6d6a63;
    --rule: #dcd9d0;
    --field: #ffffff;
    --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --ink: #e9e7e1;
      --muted: #9a978f;
      --rule: #34332f;
      --field: #1e1d1b;
      --accent: #8cb8a8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px; }

  header { padding: 40px 0 20px; border-bottom: 1px solid var(--rule); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  main { flex: 1; overflow-y: auto; }
  #log { padding-top: 8px; padding-bottom: 24px; }

  .empty { color: var(--muted); font-size: 15px; padding-top: 24px; }
  .empty ul { list-style: none; padding: 0; margin: 10px 0 0; }
  .empty li { margin: 4px 0; }
  .empty button {
    background: none; border: 0; padding: 0; font: inherit; color: var(--ink);
    cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule);
    text-underline-offset: 3px; text-align: left;
  }
  .empty button:hover { text-decoration-color: var(--ink); }

  .entry { padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .entry:last-child { border-bottom: 0; }
  .q { font-weight: 600; margin: 0 0 6px; }
  .a { margin: 0; white-space: pre-wrap; }
  .a.pending { color: var(--muted); }
  .a.refusal { color: var(--muted); }
  .meta {
    margin-top: 8px; font-size: 13px; color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  footer { border-top: 1px solid var(--rule); background: var(--bg); }
  form { display: flex; gap: 10px; padding: 16px 0 10px; }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  form button {
    font: inherit; font-size: 15px; color: var(--bg); background: var(--ink);
    border: 0; border-radius: 4px; padding: 0 18px; cursor: pointer;
  }
  form button:disabled { opacity: 0.4; cursor: default; }
  .note { font-size: 12.5px; color: var(--muted); padding-bottom: 16px; margin: 0; }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Arcvale policy questions</h1>
      <p>Leave, attendance, hours, travel, expenses, benefits, IT, onboarding, conduct.</p>
    </div>
  </header>

  <main id="scroller">
    <div class="wrap" id="log">
      <div class="empty" id="empty">
        For example:
        <ul>
          <li><button type="button">How many casual leaves do I get per year?</button></li>
          <li><button type="button">What is the hotel limit in metro cities?</button></li>
          <li><button type="button">How often must I change my password?</button></li>
        </ul>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <form id="form" autocomplete="off">
        <input id="q" name="q" placeholder="Type a question" maxlength="500" required>
        <button id="send" type="submit">Ask</button>
      </form>
      <p class="note">Answers come from a small experimental model trained on the policy documents. It can be wrong &mdash; check anything important with HR.</p>
    </div>
  </footer>

<script>
  const log = document.getElementById("log");
  const scroller = document.getElementById("scroller");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;   // textContent: never inject HTML
    return n;
  }

  async function ask(question) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();

    const entry = el("div", "entry");
    entry.append(el("p", "q", question));
    const answer = el("p", "a pending", "…");
    entry.append(answer);
    log.append(entry);
    scroller.scrollTop = scroller.scrollHeight;

    send.disabled = true;
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      if (!res.ok) throw new Error("server returned " + res.status);
      const data = await res.json();
      answer.textContent = data.answer || "(no answer)";
      answer.className = data.source ? "a" : "a refusal";
      const meta = data.source ? data.source + " · " : "No policy source · ";
      entry.append(el("div", "meta", meta + Math.round(data.latency_ms) + " ms"));
    } catch (err) {
      answer.textContent = "Could not get an answer (" + err.message + ").";
      answer.className = "a refusal";
    } finally {
      send.disabled = false;
      input.focus();
      scroller.scrollTop = scroller.scrollHeight;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    ask(question);
  });

  document.querySelectorAll(".empty button").forEach((b) =>
    b.addEventListener("click", () => ask(b.textContent))
  );
  input.focus();
</script>
</body>
</html>
